name: weekly-crawl

on:
  schedule:
    # Mondays 03:17 UTC. GitHub queues cron jobs, so the exact minute drifts.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      crawls:
        description: 'Common Crawl snapshots to merge'
        default: '1'

concurrency:
  group: weekly-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      # The database is the state that must survive between runs, so that
      # change detection and drop alerts have something to compare against.
      - name: Restore database
        uses: actions/cache@v6
        with:
          path: data
          key: softgarden-db-${{ github.run_id }}
          restore-keys: softgarden-db-

      # cluster.idx is ~100 MB per snapshot; caching it avoids re-downloading
      # and keeps us well clear of Common Crawl's WAF.
      - name: Restore Common Crawl index cache
        uses: actions/cache@v6
        with:
          path: .cc-cache
          key: cc-index-${{ github.run_id }}
          restore-keys: cc-index-

      - run: npm test

      - name: Weekly crawl
        env:
          SG_CRAWLS: ${{ github.event.inputs.crawls || '1' }}
          SG_CONCURRENCY: '3'
          SG_RPS: '4'
          SG_LOG_LEVEL: info
        run: npm run weekly

      - name: Stats
        if: always()
        run: npm run stats

      - name: Export snapshots
        if: always()
        run: |
          node --disable-warning=ExperimentalWarning src/cli.js export --what tenants --out out/tenants.csv
          node --disable-warning=ExperimentalWarning src/cli.js export --what jobs --out out/jobs.csv

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-output
          path: |
            out/
            data/softgarden.db
          retention-days: 30

      # Goes through the CLI rather than touching the database directly, so this
      # works on whichever backend SG_DB_URL selects.
      - name: Warn if drop alerts fired
        if: always()
        run: |
          OUT=$(npm run --silent alerts)
          echo "$OUT"
          COUNT=$(printf '%s\n' "$OUT" | grep -c 'job_count_drop' || true)
          if [ "${COUNT:-0}" -gt 0 ]; then
            echo "::warning::$COUNT job-count drop alert(s) - check the stats output"
          fi
