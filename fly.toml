# Public dashboard deployment.
#
# Serves data/public.db, the publication-safe snapshot built by
# scripts/build-public-db.mjs -- description text stripped, job_payloads
# dropped. The container never crawls: it is a read-only view of one run, so
# there is no volume and no scheduler here.
#
#   npm run build:public && fly deploy
#
# weekly.yml does exactly that after each crawl. Structure below is flyctl's
# own (fly launch rewrites this file); the settings are deliberate.

app = 'softgarden-crawler'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.public'

[http_service]
  internal_port = 8080
  force_https = true
  # Suspend rather than stop: resume is near-instant, so a link in an email
  # opens quickly while an idle machine costs nothing.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

# One machine, not two: --ha would add a spare, and this is a read-only
# dashboard where a few seconds of resume is cheaper than double the footprint.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
